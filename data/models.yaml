# SSoT for account-owned types.
#
# このファイルは scripts/generate_types.py への入力で、以下の 2 系統に分かれてコード生成される:
#
#   target: domain → internal/domain/*_gen.go (package: domain)
#       純ドメインモデル。account.* テーブルの行 (Write 集約) と、複数テーブルから
#       JOIN で組み立てる Read Model (PlayerView) を含む。db タグのみ付与し、
#       JSON タグは付けない (内部用、API 契約には出ない)。
#
#   target: api   → packages/api-account/*_gen.go (package: apiaccount)
#       内部 REST API の契約 (Request / Response DTO)。json タグのみ付与し、
#       db タグは付けない (API 境界専用、永続化には触れない)。Go モジュールとして
#       gateway 等に go-get される公開契約。
#
# 厳密に「Write 集約 / Read Model / API DTO」を別の型に分ける構造で、
# リポジトリ層は domain 型のみを返し、handler 層が apiaccount 型を組み立てる。

files:
  # ─── Internal domain models (target: domain → internal/domain) ──────────
  - name: player
    target: domain
    imports:
      - time
      - cloud.google.com/go/civil
    types:
      - name: Player
        comment: "Player は account.players テーブルの 1 行を表す Write 集約。Level/Exp/InitialFaction はこの型に含めない (それぞれ player_progression / player_factions の責務)。読み取り時に合成が必要な場合は PlayerView を使う。"
        fields:
          - {name: PlayerID, type: string, db: "player_id"}
          - {name: FirebaseUID, type: string, db: "firebase_uid"}
          - {name: Name, type: "*string", db: "name"}
          - {name: IsPremium, type: bool, db: "is_premium"}
          - {name: EquippedIconNo, type: "*int64", db: "equipped_icon_no"}
          - {name: OnboardingStatus, type: string, db: "onboarding_status"}
          - {name: PremiumExpiresAt, type: "*time.Time", db: "premium_expires_at"}
          - {name: CreatedAt, type: time.Time, db: "created_at"}
          - {name: UpdatedAt, type: time.Time, db: "updated_at"}

      - name: PlayerProgression
        comment: "PlayerProgression は account.player_progression の 1 行。バトル毎の高頻度 UPDATE を players から分離するための独立集約。"
        fields:
          - {name: PlayerID, type: string, db: "player_id"}
          - {name: Level, type: int64, db: "level"}
          - {name: Exp, type: int64, db: "exp"}
          - {name: UpdatedAt, type: time.Time, db: "updated_at"}

      - name: PlayerDailyBattle
        comment: "PlayerDailyBattle は account.player_daily_battle の 1 行 (PK: player_id, game_date)。1 プレイヤーにつきゲーム日ごとに 1 行の履歴台帳。"
        fields:
          - {name: PlayerID, type: string, db: "player_id"}
          - {name: GameDate, type: civil.Date, db: "game_date"}
          - {name: DailyBattleCount, type: int64, db: "daily_battle_count"}

      - name: PlayerFaction
        comment: "PlayerFaction は account.player_factions の 1 行。IsInitial=TRUE の行はオンボーディングで選択した faction (1 プレイヤーに最大 1 行)。"
        fields:
          - {name: PlayerID, type: string, db: "player_id"}
          - {name: Faction, type: string, db: "faction"}
          - {name: IsInitial, type: bool, db: "is_initial"}
          - {name: AcquiredAt, type: time.Time, db: "acquired_at"}

      - name: PlayerSettings
        comment: "PlayerSettings は account.player_settings の 1 行。"
        fields:
          - {name: PlayerID, type: string, db: "player_id"}
          - {name: Language, type: string, db: "language"}
          - {name: BgmVolume, type: int64, db: "bgm_volume"}
          - {name: SeVolume, type: int64, db: "se_volume"}
          - {name: PushEnabled, type: bool, db: "push_enabled"}
          - {name: UpdatedAt, type: time.Time, db: "updated_at"}

      - name: PlayerView
        comment: "PlayerView は Read Model: Player (players 行) + PlayerProgression の Level/Exp + player_factions.is_initial=TRUE 行の Faction 名 を 1 つに束ねた、単一の参照向けビュー。リポジトリ層が JOIN で組み立てる読み取り専用ビューであり、書き込み経路では使わない。"
        fields:
          - {name: Player, type: Player}
          - {name: Level, type: int64}
          - {name: Exp, type: int64}
          - {name: InitialFaction, type: "*string"}

  # ─── External API contract (target: api → packages/api-account) ───────
  - name: rest_api
    target: api
    imports:
      - time
    types:
      # ── Responses ──
      - name: PlayerResponse
        comment: "PlayerResponse is returned by GET /internal/v1/players/:playerId and kin. PlayerView + computed level progress を JSON 化した、内部 REST 契約の唯一の Player 表現。"
        fields:
          - {name: PlayerID, type: string, json: "player_id"}
          - {name: FirebaseUID, type: string, json: "firebase_uid"}
          - {name: Name, type: "*string", json: "name,omitempty"}
          - {name: Level, type: int64, json: "level"}
          - {name: Exp, type: int64, json: "exp"}
          - {name: IsPremium, type: bool, json: "is_premium"}
          - {name: EquippedIconNo, type: "*int64", json: "equipped_icon_no,omitempty"}
          - {name: InitialFaction, type: "*string", json: "initial_faction,omitempty"}
          - {name: OnboardingStatus, type: string, json: "onboarding_status"}
          - {name: PremiumExpiresAt, type: "*time.Time", json: "premium_expires_at,omitempty"}
          - {name: CreatedAt, type: time.Time, json: "created_at"}
          - {name: UpdatedAt, type: time.Time, json: "updated_at"}
          - {name: LevelExpCurrent, type: int64, json: "level_exp_current"}
          - {name: LevelExpRequired, type: int64, json: "level_exp_required"}

      - name: PlayerSettingsResponse
        comment: "PlayerSettingsResponse is returned by GET / PUT /internal/v1/players/:playerId/settings."
        fields:
          - {name: PlayerID, type: string, json: "player_id"}
          - {name: Language, type: string, json: "language"}
          - {name: BgmVolume, type: int64, json: "bgm_volume"}
          - {name: SeVolume, type: int64, json: "se_volume"}
          - {name: PushEnabled, type: bool, json: "push_enabled"}
          - {name: UpdatedAt, type: time.Time, json: "updated_at"}

      - name: BattleLimitResponse
        comment: "BattleLimitResponse is returned by GET /internal/v1/players/:playerId/battle-limit."
        fields:
          - {name: DailyBattleCount, type: int64, json: "daily_battle_count"}
          - {name: DailyBattleLimit, type: int64, json: "daily_battle_limit"}
          - {name: CanBattle, type: bool, json: "can_battle"}

      - name: ListFactionsResponse
        comment: "ListFactionsResponse is returned by GET /internal/v1/players/:playerId/factions."
        fields:
          - {name: Factions, type: "[]string", json: "factions"}

      # ── Requests ──
      - name: RegisterRequest
        comment: "RegisterRequest is the body for POST /internal/v1/auth/register. firebase_uid のみで登録する。表示名はオンボード内 name 入力ステップで PUT /internal/v1/players/:playerId/name 経由で確定するため、Register 時には受け取らない。"
        fields:
          - {name: FirebaseUID, type: string, json: "firebase_uid"}

      - name: LoginRequest
        comment: "LoginRequest is the body for POST /internal/v1/auth/login."
        fields:
          - {name: FirebaseUID, type: string, json: "firebase_uid"}

      - name: UpdateNameRequest
        comment: "UpdateNameRequest is the body for PUT /internal/v1/players/:playerId/name."
        fields:
          - {name: Name, type: string, json: "name"}

      - name: ValidateNameForOnboardingRequest
        comment: "ValidateNameForOnboardingRequest is the body for POST /internal/v1/players/:playerId/onboarding/name/validate. Validation only; the value is not persisted. Scenario calls this before publishing onboarding-name-set so that 4xx can be relayed to the user synchronously."
        fields:
          - {name: Name, type: string, json: "name"}

      - name: UpdatePremiumRequest
        comment: "UpdatePremiumRequest is the body for PUT /internal/v1/players/:playerId/premium. ExpiresAtMillis is a UNIX millisecond timestamp; null resets to NULL."
        fields:
          - {name: IsPremium, type: bool, json: "is_premium"}
          - {name: ExpiresAtMillis, type: "*int64", json: "expires_at_millis,omitempty"}

      - name: AddExpRequest
        comment: "AddExpRequest is the body for POST /internal/v1/players/:playerId/exp."
        fields:
          - {name: ExpGain, type: int64, json: "exp_gain"}

      - name: AwardGameExpRequest
        comment: "AwardGameExpRequest is the body for POST /internal/v1/players/award-game-exp."
        fields:
          - {name: Player1ID, type: string, json: "player1_id"}
          - {name: Player2ID, type: string, json: "player2_id"}
          - {name: WinnerNum, type: int64, json: "winner_num"}
          - {name: Reason, type: string, json: "reason"}
          - {name: MatchType, type: string, json: "match_type"}

      - name: FactionGrantRequest
        comment: "FactionGrantRequest is the body for POST /internal/v1/players/:playerId/factions."
        fields:
          - {name: Faction, type: string, json: "faction"}

      - name: SelectInitialFactionRequest
        comment: "SelectInitialFactionRequest is the body for POST /internal/v1/players/:playerId/factions/select. Scenario calls this once the tutorial/story pins the player's faction choice; account UPSERTs player_factions with is_initial=TRUE in one tx."
        fields:
          - {name: FactionID, type: string, json: "faction_id"}

      - name: UpdateSettingsRequest
        comment: "UpdateSettingsRequest is the body for PUT /internal/v1/players/:playerId/settings. Partial update semantics: nil fields are left unchanged (COALESCE in SQL). At least one non-nil field is required."
        fields:
          - {name: Language, type: "*string", json: "language,omitempty"}
          - {name: BgmVolume, type: "*int64", json: "bgm_volume,omitempty"}
          - {name: SeVolume, type: "*int64", json: "se_volume,omitempty"}
          - {name: PushEnabled, type: "*bool", json: "push_enabled,omitempty"}
