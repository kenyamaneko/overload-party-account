name: publish

# Publishes the packages/api-account Go module on push to main.
#
# The Go module tag format for a nested module is:
#   packages/api-account/v<semver>
# We never create tags manually (see common/memory feedback_no_manual_tags).
# This workflow computes the next tag and pushes it only after check + test
# pass.
#
# Bump strategy:
#   - push to main  → automatic patch bump
#   - workflow_dispatch with `bump=minor|major` → manual override
on:
  push:
    branches: [main]
    paths:
      - 'packages/api-account/**'
      - 'data/models.yaml'
      - 'scripts/generate_types.py'
      - '.github/workflows/publish.yaml'
  workflow_dispatch:
    inputs:
      bump:
        description: 'Semver bump (patch/minor/major)'
        required: true
        default: 'patch'
        type: choice
        options: [patch, minor, major]

permissions:
  contents: write

concurrency:
  group: publish-api-account
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.1'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install codegen dependencies
        run: pip install pyyaml

      - name: Verify codegen is in sync
        run: |
          python3 scripts/generate_types.py
          if ! git diff --quiet -- packages/api-account docs/API_REFERENCE.md; then
            echo "::error::Generated files are out of sync with data/models.yaml."
            echo "Run 'python3 scripts/generate_types.py' and commit."
            git diff -- packages/api-account docs/API_REFERENCE.md
            exit 1
          fi

      - name: go vet (root module)
        env:
          GOPRIVATE: 'github.com/kenyamaneko/*'
        run: go vet ./...

      - name: go vet (api-account, standalone / no workspace)
        env:
          GOPRIVATE: 'github.com/kenyamaneko/*'
          GOWORK: 'off'
        working-directory: packages/api-account
        run: go vet ./...

      - name: go test
        env:
          GOPRIVATE: 'github.com/kenyamaneko/*'
        run: go test ./...

  publish:
    needs: check
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine next tag
        id: next_tag
        env:
          BUMP: ${{ github.event.inputs.bump || 'patch' }}
        run: |
          set -euo pipefail
          prefix='packages/api-account/'
          latest=$(git tag --list "${prefix}v*" | sort -V | tail -n 1 || true)
          if [ -z "${latest}" ]; then
            next='v0.1.0'
          else
            ver="${latest#${prefix}v}"
            IFS='.' read -r major minor patch <<< "${ver}"
            case "${BUMP}" in
              major) major=$((major + 1)); minor=0; patch=0 ;;
              minor) minor=$((minor + 1)); patch=0 ;;
              patch) patch=$((patch + 1)) ;;
              *) echo "::error::unknown bump '${BUMP}'"; exit 1 ;;
            esac
            next="v${major}.${minor}.${patch}"
          fi
          tag="${prefix}${next}"
          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"
          echo "Next tag: ${tag}"

      - name: Create and push tag
        env:
          TAG: ${{ steps.next_tag.outputs.tag }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git tag "${TAG}"
          git push origin "${TAG}"

