# account のローカル開発スタック。構成と使い方は README「ローカル開発」を参照。
name: overload-party-account

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: account
      POSTGRES_PASSWORD: account
      POSTGRES_DB: account
    volumes:
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - account_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U account"]
      interval: 2s
      timeout: 2s
      retries: 15

  firestore-emulator:
    image: gcr.io/google.com/cloudsdktool/google-cloud-cli:emulators
    command: >
      gcloud beta emulators firestore start
      --project=overload-party-local
      --host-port=0.0.0.0:8080
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080 || exit 1"]
      interval: 3s
      timeout: 3s
      retries: 20

  # account は起動時に game_config の必須キーを検証するため、seed 完了を待たせる。
  firestore-init:
    image: python:3.12-slim
    depends_on:
      firestore-emulator:
        condition: service_healthy
    environment:
      FIRESTORE_EMULATOR_HOST: firestore-emulator:8080
    volumes:
      - ../overload-party-ops/firestore-seed/seed_game_config.py:/seed/seed_game_config.py:ro
      - ../overload-party-common/data/game_config_defaults.yaml:/seed/game_config_defaults.yaml:ro
    entrypoint:
      - /bin/sh
      - -c
      - pip install --quiet google-cloud-firestore pyyaml && python3 /seed/seed_game_config.py --project overload-party-local --source /seed/game_config_defaults.yaml
    restart: "no"

  account:
    image: golang:1.25-alpine
    working_dir: /src
    command: go run ./cmd/server
    depends_on:
      postgres:
        condition: service_healthy
      firestore-init:
        condition: service_completed_successfully
    environment:
      CGO_ENABLED: "0"
      # module cache は host のものを読み取り専用でマウントするため、コンテナ内 fetch を
      # 禁止して cache 欠落を即エラーにする。private module の解決は host 側 (make run の
      # go mod download) が担い、コンテナはトークン無しで cache を読むだけにする。
      GOPROXY: "off"
      GOPRIVATE: github.com/kenyamaneko/*
      # host の go.work (sibling module のローカル overlay) を bind-mount が持ち込むが、
      # コンテナには sibling が無い。workspace を無効化し go.mod の公開版で解決させる。
      GOWORK: "off"
      LOG_MODE: local
      PORT: "9005"
      DATABASE_CONN: postgres://account:account@postgres:5432/account?sslmode=disable
      DATABASE_IAM_AUTH_ENABLED: "false"
      GOOGLE_CLOUD_PROJECT_ID: overload-party-local
      # account は内部トークンの検証しか行わないため、ローカル専用に生成した公開鍵を置く。
      INTERNAL_AUTH_PUBLIC_KEY: |
        -----BEGIN PUBLIC KEY-----
        MIIBIjANBgkqhkiG9w0BAQEFAAOCAQ8AMIIBCgKCAQEAzTzyrvfPNsxHXmA0OHrT
        r9+8+gph5VZaEjg8C6DtjvnwizvjGJz5xwCusIMi2kjDQ84ls7lxskmEJTMOHb3N
        yYHCEnx+ySduR4/9joQov3DctrMmAVcQVg8ldWxgz/jRJ6XjVSqx//AufvRaFQP2
        aXxJ1ZklbNgXiSnQe+fHGKq/2sb2q7RRc+StdyUgEQZ0BhiksvGJXJGwiDSNyCAg
        xUztw/YagvnTF6ngiP5FthHMAGtKhnqCzByanhyMuzEhzlWUMOtk/MLnnuRZyaBT
        OrHkP/cOm+MTnXM2ljkZgo4X9gz7fJlLnZxYgWUTvTUG7oM3wO8czQ8tS1KTxBHZ
        SwIDAQAB
        -----END PUBLIC KEY-----
      FIRESTORE_EMULATOR_HOST: firestore-emulator:8080
    volumes:
      - ./:/src
      - ${HOST_GOMODCACHE:?make run 経由で起動すること (go env GOMODCACHE を渡す必要がある)}:/go/pkg/mod:ro
      - account_gobuild:/root/.cache/go-build
    ports:
      - "9005:9005"

volumes:
  account_pgdata:
  account_gobuild:
